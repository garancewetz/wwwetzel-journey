<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Chapeau rouge foncé -->
  <rect x="8" y="6" width="4" height="4" fill="#8B0000"/>
  <rect x="12" y="4" width="4" height="4" fill="#8B0000"/>
  <rect x="16" y="4" width="4" height="4" fill="#8B0000"/>
  <rect x="20" y="6" width="4" height="4" fill="#8B0000"/>
  
  <rect x="4" y="10" width="4" height="4" fill="#A52A2A"/>
  <rect x="8" y="10" width="4" height="4" fill="#DC143C"/>
  <rect x="12" y="8" width="4" height="4" fill="#DC143C"/>
  <rect x="16" y="8" width="4" height="4" fill="#DC143C"/>
  <rect x="20" y="10" width="4" height="4" fill="#DC143C"/>
  <rect x="24" y="10" width="4" height="4" fill="#A52A2A"/>
  
  <!-- Points blancs sur le chapeau -->
  <rect x="8" y="10" width="4" height="4" fill="#FFFFFF"/>
  <rect x="20" y="10" width="4" height="4" fill="#FFFFFF"/>
  
  <!-- Pied du champignon (beige/gris) -->
  <rect x="12" y="14" width="4" height="4" fill="#D3D3D3"/>
  <rect x="16" y="14" width="4" height="4" fill="#D3D3D3"/>
  
  <rect x="12" y="18" width="4" height="4" fill="#C0C0C0"/>
  <rect x="16" y="18" width="4" height="4" fill="#C0C0C0"/>
  
  <rect x="12" y="22" width="4" height="4" fill="#A9A9A9"/>
  <rect x="16" y="22" width="4" height="4" fill="#A9A9A9"/>
  
  <!-- Yeux méchants (rouges) -->
  <rect x="10" y="16" width="4" height="4" fill="#FF0000"/>
  <rect x="18" y="16" width="4" height="4" fill="#FF0000"/>
  
  <!-- Pupilles noires méchantes -->
  <rect x="12" y="16" width="2" height="4" fill="#000000"/>
  <rect x="20" y="16" width="2" height="4" fill="#000000"/>
  
  <!-- Bouche méchante avec dents -->
  <rect x="12" y="20" width="2" height="2" fill="#000000"/>
  <rect x="14" y="22" width="2" height="2" fill="#000000"/>
  <rect x="16" y="22" width="2" height="2" fill="#000000"/>
  <rect x="18" y="20" width="2" height="2" fill="#000000"/>
  
  <!-- Dents blanches -->
  <rect x="14" y="20" width="2" height="2" fill="#FFFFFF"/>
  <rect x="16" y="20" width="2" height="2" fill="#FFFFFF"/>
</svg>

