<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Centre du soleil -->
  <rect x="24" y="20" width="4" height="4" fill="#FFA500"/>
  <rect x="28" y="20" width="4" height="4" fill="#FFB520"/>
  <rect x="32" y="20" width="4" height="4" fill="#FFB520"/>
  <rect x="36" y="20" width="4" height="4" fill="#FFA500"/>
  
  <rect x="20" y="24" width="4" height="4" fill="#FFA500"/>
  <rect x="24" y="24" width="4" height="4" fill="#FFD700"/>
  <rect x="28" y="24" width="4" height="4" fill="#FFEA00"/>
  <rect x="32" y="24" width="4" height="4" fill="#FFEA00"/>
  <rect x="36" y="24" width="4" height="4" fill="#FFD700"/>
  <rect x="40" y="24" width="4" height="4" fill="#FFA500"/>
  
  <rect x="20" y="28" width="4" height="4" fill="#FFB520"/>
  <rect x="24" y="28" width="4" height="4" fill="#FFEA00"/>
  <rect x="28" y="28" width="4" height="4" fill="#FFFF99"/>
  <rect x="32" y="28" width="4" height="4" fill="#FFFF99"/>
  <rect x="36" y="28" width="4" height="4" fill="#FFEA00"/>
  <rect x="40" y="28" width="4" height="4" fill="#FFB520"/>
  
  <rect x="20" y="32" width="4" height="4" fill="#FFB520"/>
  <rect x="24" y="32" width="4" height="4" fill="#FFEA00"/>
  <rect x="28" y="32" width="4" height="4" fill="#FFFF99"/>
  <rect x="32" y="32" width="4" height="4" fill="#FFFF99"/>
  <rect x="36" y="32" width="4" height="4" fill="#FFEA00"/>
  <rect x="40" y="32" width="4" height="4" fill="#FFB520"/>
  
  <rect x="20" y="36" width="4" height="4" fill="#FFA500"/>
  <rect x="24" y="36" width="4" height="4" fill="#FFD700"/>
  <rect x="28" y="36" width="4" height="4" fill="#FFEA00"/>
  <rect x="32" y="36" width="4" height="4" fill="#FFEA00"/>
  <rect x="36" y="36" width="4" height="4" fill="#FFD700"/>
  <rect x="40" y="36" width="4" height="4" fill="#FFA500"/>
  
  <rect x="24" y="40" width="4" height="4" fill="#FFA500"/>
  <rect x="28" y="40" width="4" height="4" fill="#FFB520"/>
  <rect x="32" y="40" width="4" height="4" fill="#FFB520"/>
  <rect x="36" y="40" width="4" height="4" fill="#FFA500"/>
  
  <!-- Rayons du soleil -->
  <!-- Rayon haut -->
  <rect x="28" y="8" width="4" height="4" fill="#FFD700"/>
  <rect x="32" y="8" width="4" height="4" fill="#FFD700"/>
  <rect x="28" y="12" width="4" height="4" fill="#FFA500"/>
  <rect x="32" y="12" width="4" height="4" fill="#FFA500"/>
  
  <!-- Rayon bas -->
  <rect x="28" y="48" width="4" height="4" fill="#FFA500"/>
  <rect x="32" y="48" width="4" height="4" fill="#FFA500"/>
  <rect x="28" y="52" width="4" height="4" fill="#FFD700"/>
  <rect x="32" y="52" width="4" height="4" fill="#FFD700"/>
  
  <!-- Rayon gauche -->
  <rect x="8" y="28" width="4" height="4" fill="#FFA500"/>
  <rect x="8" y="32" width="4" height="4" fill="#FFA500"/>
  <rect x="12" y="28" width="4" height="4" fill="#FFD700"/>
  <rect x="12" y="32" width="4" height="4" fill="#FFD700"/>
  
  <!-- Rayon droite -->
  <rect x="48" y="28" width="4" height="4" fill="#FFD700"/>
  <rect x="48" y="32" width="4" height="4" fill="#FFD700"/>
  <rect x="52" y="28" width="4" height="4" fill="#FFA500"/>
  <rect x="52" y="32" width="4" height="4" fill="#FFA500"/>
  
  <!-- Rayon haut-gauche -->
  <rect x="12" y="12" width="4" height="4" fill="#FFD700"/>
  <rect x="16" y="16" width="4" height="4" fill="#FFA500"/>
  
  <!-- Rayon haut-droite -->
  <rect x="48" y="12" width="4" height="4" fill="#FFD700"/>
  <rect x="44" y="16" width="4" height="4" fill="#FFA500"/>
  
  <!-- Rayon bas-gauche -->
  <rect x="16" y="44" width="4" height="4" fill="#FFA500"/>
  <rect x="12" y="48" width="4" height="4" fill="#FFD700"/>
  
  <!-- Rayon bas-droite -->
  <rect x="44" y="44" width="4" height="4" fill="#FFA500"/>
  <rect x="48" y="48" width="4" height="4" fill="#FFD700"/>
</svg>

